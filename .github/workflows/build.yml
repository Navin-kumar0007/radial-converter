# Tests everything, then builds the app for every platform on every push. The builds appear as
# downloads on the run's page, so each platform can be tried as the code is written.
name: Build all platforms

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test core
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: tool/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-web
          path: app/build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-windows
          path: app/build/windows/x64/runner/Release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build macos --release
      - name: Zip the app, keeping its permissions
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/radialconverter.app radial-converter-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-macos
          path: radial-converter-macos.zip
