# Tests everything, then builds the app for every platform on every push. The builds appear as
# downloads on the run's page, so each platform can be tried as the code is written.
name: Build all platforms

on:
  push:
    branches: ['**']
    # A version tag also makes a draft release. See docs/RELEASING.md.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test core
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: tool/build_site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-web
          path: app/build/site

  # Publishes the site to Cloudflare Pages: main is the live site, any other branch gets its own
  # preview address. Nothing happens until the repository has the Cloudflare secrets; see
  # docs/RELEASING.md.
  website:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'shiftdrop' }}
    steps:
      - name: Check Cloudflare is set up
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Cloudflare secrets yet, so nothing is published."
          fi
      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: shiftdrop-web
          path: site
      - name: Publish
        if: steps.ready.outputs.go == 'true'
        run: |
          wrangler="npx --yes wrangler@4.152.0"
          if ! $wrangler pages project list | grep -qw "$PROJECT"; then
            $wrangler pages project create "$PROJECT" --production-branch main
          fi
          $wrangler pages deploy site --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" --commit-dirty=true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get the signing key, if this repository has one
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ALIAS"
              echo "APK_NAME=android"
            } >> "$GITHUB_ENV"
          else
            echo "APK_NAME=android-TEST-KEY" >> "$GITHUB_ENV"
          fi
      # No shrinking: it can't see what native code calls, and a smaller app that crashes is no use.
      - name: Build for all phones, and for most phones alone, which is far smaller
        working-directory: app
        run: |
          flutter build apk --release --no-shrink
          cp build/app/outputs/flutter-apk/app-release.apk "../shiftdrop-$APK_NAME.apk"
          flutter build apk --release --no-shrink --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "../shiftdrop-$APK_NAME-arm64.apk"
          ls -la ../shiftdrop-*.apk
      - name: Check Android itself will stop it reaching a network
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt" dump permissions "shiftdrop-$APK_NAME.apk" | tee permissions.txt
          if grep -E 'INTERNET|NETWORK|WIFI' permissions.txt; then
            echo "The release app can reach a network." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-android
          path: shiftdrop-android*.apk

  # The real Android video engine, on an emulator, since it can't run in `flutter test`.
  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: app
          script: bash tool/test_android_device.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Add the video engine
        shell: bash
        run: engines/fetch_ffmpeg_windows.sh app/build/windows/x64/runner/Release/engines
      - name: Check the video engine reads HEIC photos
        shell: bash
        run: engines/check_heic.sh app/build/windows/x64/runner/Release/engines
      - name: Reuse what reads 7z and RAR if its recipe has not changed
        uses: actions/cache@v4
        with:
          path: engines/build/windows-libarchive
          key: libarchive-windows-${{ hashFiles('engines/fetch_libarchive_windows.sh') }}
      - name: Add what reads 7z and RAR
        shell: bash
        run: engines/fetch_libarchive_windows.sh app/build/windows/x64/runner/Release
      - name: Check it reads real 7z and RAR files
        shell: bash
        working-directory: core
        run: |
          dart pub get
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/app/build/windows/x64/runner/Release:$PATH"
          LIBARCHIVE_PATH=archive.dll dart test test/libarchive_test.dart
      - name: Make the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version: ([^+]+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DOutput=$PWD\installer" app/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the installer installs, runs and removes itself
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $folder = "$env:LOCALAPPDATA\Programs\ShiftDrop"
          foreach ($file in 'shiftdrop.exe','archive.dll','engines\ffmpeg.exe') {
            if (-not (Test-Path "$folder\$file")) { throw "The installer left out $file" }
          }
          $app = Start-Process "$folder\shiftdrop.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The installed app stopped by itself: $($app.ExitCode)" }
          # A second copy hands over to the first and leaves, rather than showing a second menu.
          $second = Start-Process "$folder\shiftdrop.exe" -PassThru
          if (-not $second.WaitForExit(15000)) { throw "A second copy stayed open" }
          if ($app.HasExited) { throw "Opening a second copy stopped the first" }
          # Closing the window leaves it running in the notification area.
          $app.Refresh()
          if (-not $app.CloseMainWindow()) { throw "The app had no window to close" }
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Closing the window quit the app" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          # Opened at sign-in, it waits in the notification area with no window.
          $hidden = Start-Process "$folder\shiftdrop.exe" -ArgumentList '--hidden' -PassThru
          Start-Sleep -Seconds 15
          if ($hidden.HasExited) { throw "Starting hidden stopped the app: $($hidden.ExitCode)" }
          $hidden.Refresh()
          if ($hidden.MainWindowHandle -ne 0) { throw "Starting hidden showed the window" }
          Stop-Process -Id $hidden.Id -Force
          Start-Sleep -Seconds 2
          # The app's "Open at login" switch writes this; uninstalling must take it away.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-ItemProperty -Path $run -Name 'ShiftDrop' -Value "`"$folder\shiftdrop.exe`" --hidden" -Force | Out-Null
          Start-Process "$folder\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$folder\shiftdrop.exe") { throw "Uninstalling left the app behind" }
          if (Get-ItemProperty -Path $run -Name 'ShiftDrop' -ErrorAction SilentlyContinue) {
            throw "Uninstalling left it opening at sign-in"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-windows
          path: app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-windows-installer
          path: installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check Shift-drag
        run: app/tool/check_shift_drag.sh
      - name: Build
        working-directory: app
        run: flutter build macos --release
      # A test has no app holding PDFium, and this is the one job that has just built one.
      - name: Test PDFs against the real PDFium
        working-directory: app
        run: |
          PDFIUM_PATH="$PWD/build/macos/Build/Products/Release/ShiftDrop.app/Contents/Frameworks/PDFium.framework/pdfium" \
            flutter test test/pdf_engine_test.dart
      - name: Reuse the video engine if its recipe has not changed
        id: engine
        uses: actions/cache@v4
        with:
          path: engines/build/macos/bin
          key: ffmpeg-macos-${{ hashFiles('engines/build_ffmpeg_macos.sh') }}
      - name: Build the video engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          brew install nasm pkg-config
          engines/build_ffmpeg_macos.sh
      - name: Check the video engine reads HEIC photos
        run: engines/check_heic.sh engines/build/macos/bin
      - name: Add the video engine to the app
        run: |
          app="app/build/macos/Build/Products/Release/ShiftDrop.app"
          mkdir -p "$app/Contents/Resources/engines"
          cp engines/build/macos/bin/* "$app/Contents/Resources/engines/"
          # Signing again drops the entitlements unless given, and without them the file dialogs refuse to open.
          codesign --force --deep --sign - --entitlements app/macos/Runner/Release.entitlements "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep -q 'files.user-selected.read-write'
      - name: Zip the app, keeping its permissions
        run: ditto -c -k --keepParent "app/build/macos/Build/Products/Release/ShiftDrop.app" shiftdrop-macos.zip
      - name: Make the disk image
        run: |
          mkdir dmg
          ditto "app/build/macos/Build/Products/Release/ShiftDrop.app" "dmg/ShiftDrop.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "ShiftDrop" -srcfolder dmg -ov -format UDZO shiftdrop-macos.dmg
          hdiutil verify shiftdrop-macos.dmg
          hdiutil attach -nobrowse -mountpoint mounted shiftdrop-macos.dmg
          codesign -d --entitlements - "mounted/ShiftDrop.app" 2>&1 | grep -q 'files.user-selected.read-write'
          hdiutil detach mounted
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-macos
          path: shiftdrop-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shiftdrop-macos-dmg
          path: shiftdrop-macos.dmg

  # The build machines are Apple Silicon, and nothing else here can run the Intel half.
  macos-intel:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shiftdrop-macos
      - name: Run the download on an Intel Mac
        run: |
          [ "$(uname -m)" = x86_64 ]
          ditto -x -k shiftdrop-macos.zip unpacked
          app="unpacked/ShiftDrop.app"
          engines/check_heic.sh "$app/Contents/Resources/engines"
          # Not the hardware encoder, which a virtual machine may not have.
          "$app/Contents/Resources/engines/ffmpeg" -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=1:size=160x120 -f lavfi -i sine=duration=1 \
            -c:v libvpx-vp9 -c:a libopus out.webm
          "$app/Contents/Resources/engines/ffprobe" -hide_banner -loglevel error \
            -show_entries stream=codec_name -of csv=p=0 out.webm | tee streams.txt
          grep -q vp9 streams.txt
          grep -q opus streams.txt
      - name: Start the app on an Intel Mac
        run: |
          app="unpacked/ShiftDrop.app"
          "$app/Contents/MacOS/ShiftDrop" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"

  # Only for a version tag. A draft, so nothing is public until someone tries it and presses Publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web, android, android-device, windows, macos, macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Check the tag is the version being built
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) echo "VERSION=$version" >> "$GITHUB_ENV" ;;
            *) echo "Tag $GITHUB_REF_NAME doesn't match version $version." >&2; exit 1 ;;
          esac
      - name: Gather everything, with the source the LGPL asks for
        run: |
          mkdir dist
          # No version in the names, so the website can link to releases/latest/download/.
          name="ShiftDrop"
          cp built/shiftdrop-macos-dmg/*.dmg "dist/$name-mac.dmg"
          cp built/shiftdrop-windows-installer/*.exe "dist/$name-windows-setup.exe"
          (cd built/shiftdrop-windows && zip -qr "$GITHUB_WORKSPACE/dist/$name-windows-portable.zip" .)
          (cd built/shiftdrop-web && zip -qr "$GITHUB_WORKSPACE/dist/$name-website.zip" .)
          for apk in built/shiftdrop-android/*.apk; do
            cp "$apk" "dist/$name-$(basename "$apk" .apk | sed 's/^shiftdrop-//').apk"
          done
          mkdir sources
          curl -fsSL -o sources/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          curl -fsSL -o sources/lame-3.100.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          echo "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  sources/ffmpeg-9.0.2.tar.xz" | sha256sum -c -
          echo "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e  sources/lame-3.100.tar.gz" | sha256sum -c -
          cp sources/* dist/
          cp engines/source_notes.txt "dist/SOURCES.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          for file in $(grep -o 'latest/download/[^"]*' docs/site/index.html | sed 's|.*/||' | sort -u); do
            case "$file" in *.apk) if ls dist/*TEST-KEY* >/dev/null 2>&1; then continue; fi ;; esac
            if [ ! -f "dist/$file" ]; then
              echo "The website links to $file, which this release doesn't have." >&2
              exit 1
            fi
          done
          ls -la dist
      - name: Write the notes from the changelog
        run: |
          awk -v v="$VERSION" '
            /^## / { on = index($0, "## " v) == 1; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has nothing for $VERSION." >&2
            exit 1
          fi
          {
            echo
            echo "**Files never leave your device.** To check a download, compare it with SHA256SUMS.txt."
            if ls dist/*TEST-KEY* >/dev/null 2>&1; then
              echo
              echo "> Not ready to publish: the APKs use a test key. See docs/RELEASING.md."
            fi
          } >> notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft "${prerelease[@]}" \
            --title "ShiftDrop $GITHUB_REF_NAME" --notes-file notes.md
