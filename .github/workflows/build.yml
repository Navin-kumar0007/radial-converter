# Tests everything, then builds the app for every platform on every push. The builds appear as
# downloads on the run's page, so each platform can be tried as the code is written.
name: Build all platforms

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test core
        working-directory: core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: tool/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-web
          path: app/build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  # The real Android video engine, on an emulator, since it can't run in `flutter test`.
  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: app
          script: bash tool/test_android_device.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Add the video engine
        shell: bash
        run: engines/fetch_ffmpeg_windows.sh app/build/windows/x64/runner/Release/engines
      - name: Check the video engine reads HEIC photos
        shell: bash
        run: engines/check_heic.sh app/build/windows/x64/runner/Release/engines
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-windows
          path: app/build/windows/x64/runner/Release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check Shift-drag
        run: app/tool/check_shift_drag.sh
      - name: Build
        working-directory: app
        run: flutter build macos --release
      # A test has no app holding PDFium, and this is the one job that has just built one.
      - name: Test PDFs against the real PDFium
        working-directory: app
        run: |
          PDFIUM_PATH="$PWD/build/macos/Build/Products/Release/radialconverter.app/Contents/Frameworks/PDFium.framework/pdfium" \
            flutter test test/pdf_engine_test.dart
      - name: Reuse the video engine if its recipe has not changed
        id: engine
        uses: actions/cache@v4
        with:
          path: engines/build/macos/bin
          key: ffmpeg-macos-${{ hashFiles('engines/build_ffmpeg_macos.sh') }}
      - name: Build the video engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          brew install nasm pkg-config
          engines/build_ffmpeg_macos.sh
      - name: Check the video engine reads HEIC photos
        run: engines/check_heic.sh engines/build/macos/bin
      - name: Add the video engine to the app
        run: |
          app=app/build/macos/Build/Products/Release/radialconverter.app
          mkdir -p "$app/Contents/Resources/engines"
          cp engines/build/macos/bin/* "$app/Contents/Resources/engines/"
          codesign --force --deep --sign - "$app"
      - name: Zip the app, keeping its permissions
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/radialconverter.app radial-converter-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: radial-converter-macos
          path: radial-converter-macos.zip

  # The build machines are Apple Silicon, and nothing else here can run the Intel half.
  macos-intel:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: radial-converter-macos
      - name: Run the download on an Intel Mac
        run: |
          [ "$(uname -m)" = x86_64 ]
          ditto -x -k radial-converter-macos.zip unpacked
          app=unpacked/radialconverter.app
          engines/check_heic.sh "$app/Contents/Resources/engines"
          # Not the hardware encoder, which a virtual machine may not have.
          "$app/Contents/Resources/engines/ffmpeg" -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=1:size=160x120 -f lavfi -i sine=duration=1 \
            -c:v libvpx-vp9 -c:a libopus out.webm
          "$app/Contents/Resources/engines/ffprobe" -hide_banner -loglevel error \
            -show_entries stream=codec_name -of csv=p=0 out.webm | tee streams.txt
          grep -q vp9 streams.txt
          grep -q opus streams.txt
      - name: Start the app on an Intel Mac
        run: |
          app=unpacked/radialconverter.app
          "$app/Contents/MacOS/radialconverter" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
